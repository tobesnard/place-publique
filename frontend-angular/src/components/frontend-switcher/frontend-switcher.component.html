@if (reactUrl()) {
<div class="flex items-center gap-3">
    <label class="cursor-pointer text-sm font-medium text-[var(--color-dark-text)]" (click)="goToReact()">
        React
    </label>
    <button type="button" role="switch" aria-checked="true" (click)="goToReact()"
        class="relative inline-flex h-6 w-11 shrink-0 cursor-pointer rounded-full border-2 border-transparent bg-[var(--color-primary)] transition-colors duration-200 ease-in-out focus:outline-none focus:ring-2 focus:ring-[var(--color-primary)] focus:ring-offset-2">
        <span
            class="pointer-events-none inline-block h-5 w-5 translate-x-5 transform rounded-full bg-white shadow-lg ring-0 transition duration-200 ease-in-out"></span>
    </button>
    <label class="cursor-pointer text-sm font-medium text-[var(--color-dark-text)]" (click)="goToReact()">
        Angular
    </label>
</div>
}
